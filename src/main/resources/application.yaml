spring:
  application:
    name: grpc-news-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/news_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucket: guildhub-news

grpc:
  server:
    port: 9090