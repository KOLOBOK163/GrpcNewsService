spring:
  application:
    name: grpc-news-service
  datasource:
    url: jdbc:postgresql://localhost:5432/news_db
    username: postgres
    password: 12345678
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

grpc:
  server:
    port: 9090